[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crackecraft"
version = "0.1.0"
description = "Cross-platform Minecraft Java launcher with official Microsoft authentication"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
  "minecraft-launcher-lib>=8.0,<9",
  "keyring>=25,<27",
  "psutil>=6,<8",
  "secretstorage>=3.2; sys_platform == 'linux'",
]

[project.scripts]
crackecraft = "crackecraft.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
