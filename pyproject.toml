[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crackecraft"
version = "0.1.0"
description = "Cross-platform Minecraft Android APK launcher for ADB and Waydroid"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.scripts]
crackecraft = "crackecraft.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
